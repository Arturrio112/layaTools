[package]
name = "lt"
version = "0.1.0"
edition = "2021"
description = "Fast per-project code index and search for LLMs, with an optional Laya judge"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
tempfile = "3"
